[project]
name = "backend"
version = "0.1.0"
description = "Artemis-X Edge AI Backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.174",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
