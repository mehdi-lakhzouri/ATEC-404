[project]
name = "artemis-ground"
version = "0.5.5"
description = "Artemis-X ground station backend (R5.5): telemetry ingestion, MongoDB, versioned REST and WebSocket APIs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymongo>=4.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[dependency-groups]
dev = ["httpx>=0.28", "websockets>=13"]

[tool.uv]
package = false
