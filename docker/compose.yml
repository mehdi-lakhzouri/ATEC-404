# Artemis-X ground station infrastructure (R5.5): MongoDB for the mission database.
#   cp docker/.env.example docker/.env      (then set a real password - docker/.env is git-ignored)
#   docker compose -f docker/compose.yml up -d
#   docker compose -f docker/compose.yml ps        (STATUS must show "healthy")
#   docker compose -f docker/compose.yml down      (data survives in the named volume; add -v to delete it)
name: artemis

services:
  mongodb:
    image: mongo:8.0.4                     # pinned official image
    container_name: artemis-mongodb
    restart: unless-stopped
    env_file:
      - .env                               # MONGO_ROOT_USERNAME / MONGO_ROOT_PASSWORD / MONGO_DB (see .env.example)
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in docker/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in docker/.env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-artemis_mission}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"   # localhost only
    volumes:
      - artemis-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_ROOT_USERNAME}", "--password", "${MONGO_ROOT_PASSWORD}",
             "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  artemis-mongodb-data:
    name: artemis-mongodb-data
